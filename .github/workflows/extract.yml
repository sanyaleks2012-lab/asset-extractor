name: Extract and Release Assets

on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: 'Direct URL to download bin/bundle'
        required: true
        type: string
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download input binary
        run: |
          mkdir -p bin
          curl -L "${{ inputs.asset_url }}" -o bin/data.bin

      - name: Run extraction script
        run: |
          python v.py bin bin_out

      - name: Compress assets (Split if > 2GB)
        run: |
          zip -r -9 extracted_assets.zip bin_out
          # Разбиваем на части по 1900MB, если размер превышает 2GB
          split -b 1900m extracted_assets.zip extracted_assets.zip.part_ || true

      - name: Create Release and Upload Assets
        run: |
          gh release create "${{ inputs.tag_name }}" \
            --title "Release ${{ inputs.tag_name }}" \
            --notes "Automated asset extraction"

          if ls extracted_assets.zip.part_* 1> /dev/null 2>&1; then
            gh release upload "${{ inputs.tag_name }}" extracted_assets.zip.part_*
          else
            gh release upload "${{ inputs.tag_name }}" extracted_assets.zip
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
