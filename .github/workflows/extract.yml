name: Extract and Release Assets

on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: 'Direct URL to download zip archive'
        required: true
        type: string
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and Unpack Input Archive
        run: |
          mkdir -p bin
          curl -L "${{ inputs.asset_url }}" -o archive.zip
          unzip -o archive.zip -d bin/
          rm archive.zip

      - name: Run extraction script
        run: |
          python v.py bin bin_out

      - name: Compress assets (Split if > 1.9GB)
        run: |
          zip -r -9 extracted_assets.zip bin_out
          if [ $(stat -c%s "extracted_assets.zip") -gt 2000000000 ]; then
            split -b 1900m extracted_assets.zip extracted_assets.zip.part_
            rm extracted_assets.zip
          fi

      - name: Create Release and Upload Assets
        run: |
          # Создаем релиз, если его нет (игнорируем ошибку, если тег существует)
          gh release create "${{ inputs.tag_name }}" \
            --title "Release ${{ inputs.tag_name }}" \
            --notes "Automated asset extraction" || true

          # Загружаем файлы с флагом --clobber (перезапись файлов при совпадении)
          if ls extracted_assets.zip.part_* 1> /dev/null 2>&1; then
            gh release upload "${{ inputs.tag_name }}" extracted_assets.zip.part_* --clobber
          else
            gh release upload "${{ inputs.tag_name }}" extracted_assets.zip --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
